<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#AAEE22">
  <meta name="description" content="BoothBoss — the simple app for running your pop-up boutique.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.svg">
  <link rel="apple-touch-icon" href="assets/icon-192.svg">
  <link rel="stylesheet" href="styles.css">
  <title>BoothBoss</title>
</head>
<body>
  <div id="offline" class="offline" hidden>Offline — sales stay saved on this device.</div>
  <header class="topbar">
    <button class="brand" data-nav="home" aria-label="BoothBoss home"><span class="brand-dot"></span><span>BoothBoss</span></button>
    <button class="icon-button" data-nav="search" aria-label="Search">⌕</button>
  </header>
  <main id="app" tabindex="-1"><div class="loading">Opening your booth…</div></main>
  <nav class="bottom-nav" aria-label="Primary navigation">
    <button data-nav="home"><span>⌂</span>Home</button>
    <button data-nav="sell"><span>＋</span>Sell</button>
    <button data-nav="catalog"><span>▦</span>Catalog</button>
    <button data-nav="events"><span>◫</span>Events</button>
    <button data-nav="more"><span>•••</span>More</button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
